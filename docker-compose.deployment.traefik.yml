version: '3.8'

services:
  application:
    image: ${CI_REGISTRY_IMAGE}/application:${CI_COMMIT_TAG}
    restart: unless-stopped
    tty: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_URL: ${DATABASE_URL}
      # DB pool hardening (see server/database/index.ts) — empty = built-in defaults
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-}
      MCP_SESSION_IDLE_TTL_MS: ${MCP_SESSION_IDLE_TTL_MS:-}
      APP_KEY: ${APP_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-}
      EMBEDDING_INDEX_TIMEOUT_MS: ${EMBEDDING_INDEX_TIMEOUT_MS:-}
      NUXT_PUBLIC_APP_URL: https://${APP_HOST}
      NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL:-}
      OPENCODE_CONFIG_B64: ${OPENCODE_CONFIG_B64:-}
      DOC_AGENT: ${DOC_AGENT:-cursor}
      NUXT_PUBLIC_DOC_AGENT: ${DOC_AGENT:-cursor}
      CURSOR_MODEL: ${CURSOR_MODEL:-auto}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      NITRO_POSTRACK_API_URL: ${NITRO_POSTRACK_API_URL:-}
      NITRO_POSTRACK_API_KEY: ${NITRO_POSTRACK_API_KEY:-}
      ORBIT_REPO_DIR: /home/nodejs/.local/share/orbit-docs-repositories
      # MCP OAuth (optional — enables Gemini Spark / OAuth MCP clients)
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_REDIRECT_URIS: ${MCP_OAUTH_REDIRECT_URIS:-}
      MCP_OAUTH_TOKEN_EXPIRY: ${MCP_OAUTH_TOKEN_EXPIRY:-3600}
      MCP_OAUTH_SIGNING_SECRET: ${MCP_OAUTH_SIGNING_SECRET:-}
      MCP_OAUTH_RESOURCE_PATH: ${MCP_OAUTH_RESOURCE_PATH:-/api/mcp/connect}
    deploy:
      replicas: ${COMPOSE_REPLICAS:-1}
    volumes:
      - orbit-docs-repositories:/home/nodejs/.local/share/orbit-docs-repositories
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${IMAGE_NAME}-${APP_ENV}.entrypoints=http"
      - "traefik.http.routers.${IMAGE_NAME}-${APP_ENV}.rule=Host(`${APP_HOST}`)"
      - "traefik.http.middlewares.${IMAGE_NAME}-${APP_ENV}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${IMAGE_NAME}-${APP_ENV}.middlewares=${IMAGE_NAME}-${APP_ENV}-https-redirect"
      - "traefik.http.routers.${IMAGE_NAME}-${APP_ENV}-secure.entrypoints=https"
      - "traefik.http.routers.${IMAGE_NAME}-${APP_ENV}-secure.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.${IMAGE_NAME}-${APP_ENV}-secure.tls=true"
      - "traefik.http.routers.${IMAGE_NAME}-${APP_ENV}-secure.tls.certresolver=http"
      - "traefik.http.routers.${IMAGE_NAME}-${APP_ENV}-secure.service=${IMAGE_NAME}-${APP_ENV}"
      - "traefik.http.services.${IMAGE_NAME}-${APP_ENV}.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
      # Lets willfarrell/docker-autoheal restart this container when the
      # Dockerfile HEALTHCHECK (/api/health) reports unhealthy.
      - "autoheal=true"
      - "autoheal.stop.timeout=30"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"


  # Restarts `application` when its HEALTHCHECK (/api/health) goes unhealthy.
  # Run exactly ONE autoheal per host — if this host runs multiple stacks,
  # delete it here and run a single standalone instance instead.
  autoheal:
    image: willfarrell/docker-autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
networks:
  proxy:
    external: true

volumes:
  orbit-docs-repositories:
